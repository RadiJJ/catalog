<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Каталог | Корзина</title>
  
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <div class="brand-block">
        <a href="index.html" class="logo">Каталог</a>
        <span class="logo-sub">Модный гардероб</span>
      </div>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Каталог</a>
        <a href="product.html?id=coat" class="nav-link">Товар недели</a>
        <a href="cart.html" class="nav-link active">Корзина</a>
      </nav>

      <div class="header-actions">
        <a href="index.html" class="icon-btn" title="Избранное">
          ♥
          <span class="badge wishlist-badge" style="display: none;">0</span>
        </a>
        <a href="cart.html" class="icon-btn" aria-label="Перейти в корзину">
          🛒
          <span class="badge cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    
    <div style="margin-top: 0.8rem; font-size: 0.8rem; color: var(--text-muted);">
      <a href="index.html" style="color: var(--text-secondary);">Каталог</a> / 
      <span>Корзина</span>
    </div>

    <h1 style="font-size: 1.4rem; font-weight: 700; margin-top: 0.4rem;">Ваша корзина</h1>

    <div class="cart-layout">
      
      <!-- Список выбранных товаров -->
      <section class="cart-items-list" id="cartItemsList">
        <!-- JS рендерит список товаров -->
      </section>

      <!-- Итог и быстрый чекаут -->
      <aside class="order-summary">
        <h2 style="font-size: 1.1rem; font-weight: 700;">Сумма заказа</h2>

        <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-secondary);">
          <span>Товары:</span>
          <span id="summarySubtotal">0 BYN</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-secondary);">
          <span>Доставка (бесплатно от 150 BYN):</span>
          <span id="summaryDelivery">0 BYN</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: 800; color: var(--accent-price); border-top: 1px solid var(--accent-border); padding-top: 0.8rem;">
          <span>Итого к оплате:</span>
          <span id="summaryTotal">0 BYN</span>
        </div>

        <form id="checkoutForm" style="margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.6rem;">
          <h3 style="font-size: 0.9rem; font-weight: 600;">Быстрое оформление</h3>
          
          <input type="text" id="custName" class="form-input" placeholder="Имя и Фамилия" required>
          <input type="tel" id="custPhone" class="form-input" placeholder="Телефон (+375 ...)" required>
          <input type="text" id="custAddress" class="form-input" placeholder="Адрес доставки (Город, Улица)" required>

          <button type="submit" class="btn-primary" style="margin-top: 0.4rem;">
            Оформить заказ
          </button>
        </form>

      </aside>

    </div>

  </main>

  <footer class="footer">
    <div class="container" style="display: flex; flex-direction: column; gap: 0.3rem; align-items: center;">
      <span class="logo" style="font-size: 1.1rem;">Каталог</span>
      <p style="font-size: 0.75rem; color: var(--text-muted);">© 2026 Мобильное приложение одежды (WebView).</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
