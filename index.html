<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Каталог | Мобильное приложение одежды</title>
  
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Хедер сайта -->
  <header class="header">
    <div class="container header-inner">
      
      <div class="brand-block">
        <a href="index.html" class="logo">Каталог</a>
        <span class="logo-sub">Модный гардероб</span>
      </div>

      <!-- Навигация -->
      <nav class="nav-menu">
        <a href="index.html" class="nav-link active">Каталог</a>
        <a href="product.html?id=coat" class="nav-link">Товар недели</a>
        <a href="wishlist.html" class="nav-link">Избранное</a>
        <a href="cart.html" class="nav-link">Корзина</a>
      </nav>

      <!-- Иконки действий: Избранное и Корзина -->
      <div class="header-actions">
        <a href="wishlist.html" class="icon-btn" title="Избранное" aria-label="Перейти в избранное">
          <svg class="icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          <span class="badge wishlist-badge" style="display: none;">0</span>
        </a>
        <a href="cart.html" class="icon-btn" aria-label="Перейти в корзину" title="Корзина">
          <svg class="icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          <span class="badge cart-badge">0</span>
        </a>
      </div>

    </div>
  </header>

  <!-- Основной контент -->
  <main class="container">

    <!-- Поиск по каталогу -->
    <section class="search-section">
      <div class="search-box">
        <span class="search-icon-wrapper" style="color: var(--text-muted); display: flex; align-items: center;">
          <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск вещей, бренда или категории...">
      </div>
    </section>

    <!-- Секция категорий -->
    <section>
      <h2 class="section-title">Категории</h2>
      <div class="categories-scroll">
        <div class="category-card active" data-category="all">
          <div class="category-thumb">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 5.6L20 10l-5.6 2.4L12 18l-2.4-5.6L4 10l5.6-2.4z"></path></svg>
          </div>
          <div class="category-info">
            <span class="category-name">Все товары</span>
            <span class="category-count">10 товаров</span>
          </div>
        </div>
        <div class="category-card" data-category="women">
          <div class="category-thumb">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12l2 6-4 2v10H8V11L4 9z"></path></svg>
          </div>
          <div class="category-info">
            <span class="category-name">Женская</span>
            <span class="category-count">4 товара</span>
          </div>
        </div>
        <div class="category-card" data-category="men">
          <div class="category-thumb">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4 3 13h10z"></path><path d="M12 3v17"></path></svg>
          </div>
          <div class="category-info">
            <span class="category-name">Мужская</span>
            <span class="category-count">2 товара</span>
          </div>
        </div>
        <div class="category-card" data-category="shoes">
          <div class="category-thumb">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16l3-8 5 2 7-3v9H4z"></path></svg>
          </div>
          <div class="category-info">
            <span class="category-name">Обувь</span>
            <span class="category-count">2 товара</span>
          </div>
        </div>
        <div class="category-card" data-category="bags">
          <div class="category-thumb">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="13" rx="2"></rect><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
          </div>
          <div class="category-info">
            <span class="category-name">Сумки & Аксессуары</span>
            <span class="category-count">2 товара</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Динамический каталог товаров -->
    <section class="catalog-section">
      <h2 class="section-title">Коллекция сезона</h2>
      
      <!-- Динамическая сетка карточек -->
      <div class="product-grid" id="catalogDynamicGrid">
        <!-- JS рендерит карточки здесь -->
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container" style="display: flex; flex-direction: column; gap: 0.3rem; align-items: center;">
      <span class="logo" style="font-size: 1.1rem;">Каталог</span>
      <p style="font-size: 0.75rem; color: var(--text-muted);">© 2026 Мобильное приложение одежды (WebView).</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
