<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Каталог | Избранное</title>

        <a href="cart.html" class="nav-link">Корзина</a>
      </nav>

      <div class="header-actions">
        <a href="wishlist.html" class="icon-btn active" title="Избранное">
          <svg class="icon-svg filled" width="20" height="20" viewBox="0 0 24 24" fill="#C47847" stroke="#C47847" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          <span class="badge wishlist-badge" style="display: none;">0</span>

        <a href="cart.html" class="icon-btn" aria-label="Перейти в корзину">

    </div>
  </header>

  <main class="container">
    
    <div style="margin-top: 0.8rem; font-size: 0.8rem; color: var(--text-muted);">
      <a href="index.html" style="color: var(--text-secondary);">Каталог</a> / 
      <span>Избранное</span>
    </div>

    <h1 style="font-size: 1.4rem; font-weight: 700; margin-top: 0.4rem; margin-bottom: 1rem;">Избранные товары</h1>

    <!-- Динамическая сетка избранных товаров -->
    <div class="product-grid" id="wishlistDynamicGrid">
      <!-- JS рендерит список избранного -->
    </div>

  </main>

  <footer class="footer">
    <div class="container" style="display: flex; flex-direction: column; gap: 0.3rem; align-items: center;">
      <span class="logo" style="font-size: 1.1rem;">Каталог</span>
      <p style="font-size: 0.75rem; color: var(--text-muted);">© 2026 Мобильное приложение одежды (WebView).</p>

  </footer>

  <script src="js/main.js"></script>
