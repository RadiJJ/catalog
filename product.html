<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Каталог | Товар</title>
  
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <div class="brand-block">
        <a href="index.html" class="logo">Каталог</a>
        <span class="logo-sub">Модный гардероб</span>
      </div>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Каталог</a>
        <a href="product.html?id=coat" class="nav-link active">Товар недели</a>
        <a href="cart.html" class="nav-link">Корзина</a>
      </nav>

      <div class="header-actions">
        <a href="index.html" class="icon-btn" title="Избранное">
          ♥
          <span class="badge wishlist-badge" style="display: none;">0</span>
        </a>
        <a href="cart.html" class="icon-btn" aria-label="Перейти в корзину">
          🛒
          <span class="badge cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    
    <!-- Хлебные крошки -->
    <div id="productBreadcrumbs" style="margin-top: 0.8rem; font-size: 0.8rem; color: var(--text-muted);">
      <a href="index.html" style="color: var(--text-secondary);">Каталог</a> / 
      <span>Загрузка...</span>
    </div>

    <!-- Динамический контейнер детализации товара -->
    <div class="product-detail-layout" id="productDetailContainer">
      <!-- JS подгрузит детали выбранного товара -->
    </div>

  </main>

  <footer class="footer">
    <div class="container" style="display: flex; flex-direction: column; gap: 0.3rem; align-items: center;">
      <span class="logo" style="font-size: 1.1rem;">Каталог</span>
      <p style="font-size: 0.75rem; color: var(--text-muted);">© 2026 Мобильное приложение одежды (WebView).</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
